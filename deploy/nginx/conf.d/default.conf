# ═══════════════════════════════════════════════════════════════
#  AfDB Platform — Nginx Site Configuration
# ═══════════════════════════════════════════════════════════════
#  Replace YOUR_DOMAIN with your actual domain (e.g., afdb-app.com)
# ═══════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Beta Frontend (Auth Portal) ──────────────────────────
    # https://YOUR_DOMAIN/ → Beta Frontend (port 3000)
    location / {
        proxy_pass http://beta-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Core Frontend (Enterprise Dashboard) ─────────────────
    # https://YOUR_DOMAIN/app/ → Core Frontend (port 3001)
    location /app/ {
        proxy_pass http://core-frontend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Beta Backend (Auth API) ──────────────────────────────
    # https://YOUR_DOMAIN/api/v1/auth/* → Beta Backend (port 4000)
    # https://YOUR_DOMAIN/api/v1/sso/*  → Beta Backend (port 4000)
    # https://YOUR_DOMAIN/api/v1/mfa/*  → Beta Backend (port 4000)
    location /api/v1/auth/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://beta-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/sso/ {
        proxy_pass http://beta-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/mfa/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://beta-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Core Backend (Business API) ──────────────────────────
    # https://YOUR_DOMAIN/api/v1/projects/* → Core Backend (port 4001)
    # https://YOUR_DOMAIN/api/v1/activities/* → Core Backend (port 4001)
    # https://YOUR_DOMAIN/api/v1/dashboard/* → Core Backend (port 4001)
    location /api/v1/projects/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://core-backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/activities/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://core-backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/dashboard/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://core-backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Documentation ────────────────────────────────────
    location /api-docs {
        return 301 /api-docs/;
    }
    location /api-docs/ {
        proxy_pass http://beta-backend:4000/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Health Check ─────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
