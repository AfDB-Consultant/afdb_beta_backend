# ═══════════════════════════════════════════════════════════════
#  AfDB Platform — Nginx Site Configuration
# ═══════════════════════════════════════════════════════════════
#  Subdomains:
#    afdb-beta.atradezone.ca      → Beta Frontend (Auth Portal)
#    afdb-core.atradezone.ca      → Core Frontend (Dashboard)
#    afdb-api.atradezone.ca       → Beta Backend (Auth API)
#    afdb-core-api.atradezone.ca  → Core Backend (Business API)
# ═══════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect (all subdomains) ───────────────────
server {
    listen 80;
    server_name afdb-beta.atradezone.ca afdb-core.atradezone.ca afdb-api.atradezone.ca afdb-core-api.atradezone.ca;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Beta Frontend: afdb-beta.atradezone.ca ───────────────────
server {
    listen 443 ssl http2;
    server_name afdb-beta.atradezone.ca;

    ssl_certificate     /etc/letsencrypt/live/afdb-beta.atradezone.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afdb-beta.atradezone.ca/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://beta-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Core Frontend: afdb-core.atradezone.ca ───────────────────
server {
    listen 443 ssl http2;
    server_name afdb-core.atradezone.ca;

    ssl_certificate     /etc/letsencrypt/live/afdb-core.atradezone.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afdb-core.atradezone.ca/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://core-frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Beta Backend API: afdb-api.atradezone.ca ─────────────────
server {
    listen 443 ssl http2;
    server_name afdb-api.atradezone.ca;

    ssl_certificate     /etc/letsencrypt/live/afdb-api.atradezone.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afdb-api.atradezone.ca/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://beta-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://beta-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/sso/ {
        proxy_pass http://beta-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/mfa/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://beta-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        return 301 /api-docs/;
    }
    location /api-docs/ {
        proxy_pass http://beta-backend:4000/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}

# ── Core Backend API: afdb-core-api.atradezone.ca ────────────
