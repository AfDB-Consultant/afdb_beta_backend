# ═══════════════════════════════════════════════════════════════
#  AfDB Platform — Production Docker Compose
# ═══════════════════════════════════════════════════════════════
#  Usage:
#    1. Copy .env.production → .env and fill in real values
#    2. docker compose up -d --build
# ═══════════════════════════════════════════════════════════════

services:
  # ── Infrastructure ──────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: afdb-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-afdb_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afdb-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Services ────────────────────────────────────────
  beta-backend:
    build:
      context: ../afdb_beta_backend
      dockerfile: Dockerfile
    container_name: afdb-beta-backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/afdb_beta?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORE_API_URL=http://core-backend:4001/api/v1
      - CORE_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  core-backend:
    build:
      context: ../afdb_core_backend
      dockerfile: Dockerfile
    container_name: afdb-core-backend
    restart: always
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - PORT=4001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/afdb_core?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend Services ───────────────────────────────────────
  beta-frontend:
    build:
      context: ../afdb_beta_frontend
      dockerfile: Dockerfile
    container_name: afdb-beta-frontend
    restart: always
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=https://afdb-api.atradezone.ca/api/v1
      - NEXT_PUBLIC_CORE_URL=https://afdb-core.atradezone.ca
      - NEXT_PUBLIC_APP_NAME=AfDB Secure Access Portal

  core-frontend:
    build:
      context: ../afdb_core_frontend
      dockerfile: Dockerfile
    container_name: afdb-core-frontend
    restart: always
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=https://afdb-core-api.atradezone.ca/api/v1
      - NEXT_PUBLIC_APP_NAME=AfDB Enterprise Dashboard

  # ── Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: afdb-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - beta-backend
      - core-backend
      - beta-frontend
      - core-frontend

  # ── SSL Certificate Auto-Renewal ────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  mongo_data:
  redis_data:
